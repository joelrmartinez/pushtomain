<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 48 48" width="48" height="48" fill="none" role="img" aria-labelledby="chalk-tick-title">
  <title id="chalk-tick-title">Chalk tick</title>
  <defs>
    <filter id="chalk" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="5" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.25" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.55" numOctaves="3" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="luminanceToAlpha" result="grainA"/>
      <feComponentTransfer in="grainA" result="mask">
        <feFuncA type="table" tableValues="0 0.4 1 1 1 1 1 1"/>
      </feComponentTransfer>
      <feComposite in="rough" in2="mask" operator="in"/>
    </filter>
  </defs>
  <path filter="url(#chalk)" stroke="#1b4d3e" stroke-width="6.5" stroke-linecap="round" d="M19 45.5C26.2 37.6 34.4 28.8 45.5 18.5"/>
</svg>
